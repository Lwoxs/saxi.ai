name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate community API submissions
        run: npm run validate:community-apis

      - name: Validate types and Wrangler bindings
        run: npm run check

      - name: Build site
        run: npm run build

      - name: Verify internal links
        run: npm run verify:links
